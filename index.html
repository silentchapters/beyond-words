
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b20">

  <title>Beyond Words</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <main class="universe">

    <!-- Starry sky -->
    <div class="stars"></div>
    <div class="shooting-star"></div>

    <!-- Opening scene -->
    <section class="intro">
      <h1>Beyond Words</h1>

      <p>Everything My Heart Holds</p>

      <button class="enter-button">
        Enter
      </button>
    </section>

    <!-- Ocean -->
    <div class="ocean">
      <div class="wave"></div>
      <div class="wave"></div>
    </div>

    <!-- Constellation -->
    <section class="constellation">

      <div class="constellation-heading">
        <h2>A Little Universe</h2>
        <p>Some things are discovered, not explained.</p>
      </div>

      <div class="constellation-sky">

        <div class="constellation-lines">
          <span class="line line-one"></span>
          <span class="line line-two"></span>
          <span class="line line-three"></span>
          <span class="line line-four"></span>
        </div>

        <button class="constellation-star star-memories"
          data-message="memories" aria-label="Memories">
          <span></span>
          <small>Memories</small>
        </button>

        <button class="constellation-star star-promises"
          data-message="promises" aria-label="Promises">
          <span></span>
          <small>Promises</small>
        </button>

        <button class="constellation-star star-gratitude"
          data-message="gratitude" aria-label="Gratitude">
          <span></span>
          <small>Gratitude</small>
        </button>

        <button class="constellation-star star-dreams"
          data-message="dreams" aria-label="Dreams">
          <span></span>
          <small>Dreams</small>
        </button>

        <button class="constellation-star star-beyond"
          data-message="beyond" aria-label="Beyond Words">
          <span></span>
          <small>Beyond Words</small>
        </button>

      </div>
    </section>

    <!-- Message window -->
    <div class="message-panel">

      <button class="close-message" aria-label="Close message">
        &times;
      </button>

      <h2 class="message-title"></h2>

      <p class="message-text"></p>

    </div>

  </main>

</body>
</html>
